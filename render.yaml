# Render topology for MomentumQuest: the Django API, and nothing else.
#
#   Vercel (Next.js)
#         |  HTTPS
#         v
#   Render Free  --- SQL/TLS --->  Neon PostgreSQL
#    (this file)  --- S3 API  --->  Cloudflare R2 (private documents)
#         ^
#         |  writes to the same database
#   GitHub Actions (Selenium scraper), fallback: local workstation
#
# Three things are deliberately *not* here, and each was removed rather than
# never added:
#
#   * the managed PostgreSQL -- the database is Neon, reached over TLS with the
#     same DB_* variables settings.py already read;
#   * the persistent disk -- free instance storage is ephemeral, so private
#     documents go to object storage instead of a mount;
#   * the scraper Cron and the Chromium variables -- a browser does not fit a
#     free instance, and the current scraper is not safe to schedule
#     unattended. See the note at the bottom.
#
# What remains is a stateless web process, which is the only shape a free
# instance can host honestly.

services:
  - type: web
    name: momentumquest-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Closest region to the Malaysian job market this serves. Render has no
    # Malaysia region; Singapore is the nearest. Keep the Neon project in the
    # same region or every query pays a cross-region round trip.
    region: singapore
    plan: free
    healthCheckPath: /admin/login/

    envVars:
      - key: DJANGO_DEBUG
        value: "false"

      # Generated once by Render and kept. settings.py refuses to start on the
      # development key when DEBUG is false, so this must be a real value.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      # Render terminates TLS at its edge and forwards X-Forwarded-Proto.
      # Without this Django sees plain HTTP behind the proxy, the SSL redirect
      # loops, and the secure cookies never send.
      - key: DJANGO_BEHIND_TLS_PROXY
        value: "true"

      # The service's own hostname, e.g. momentumquest-api.onrender.com.
      - key: DJANGO_ALLOWED_HOSTS
        sync: false

      # The stable Vercel production origin, with scheme. Not a wildcard over
      # *.vercel.app: every preview deployment gets its own subdomain, and
      # trusting the pattern would let any preview build -- including one from a
      # fork -- make credentialed calls against production data.
      #
      # Three separate settings, three different questions: CORS decides who may
      # read a response, CSRF_TRUSTED_ORIGINS decides whose unsafe requests are
      # believed, and FRONTEND_URL is what verification and password-reset
      # emails link to.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

      # Neon. DB_HOST is the pooled endpoint; DB_SSLMODE defaults to require
      # when DEBUG is false, so it only needs setting to override that.
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"

      # Cloudflare R2, holding certificates. The bucket stays private: nothing
      # is served by a permanent public URL, and Django authorises every read.
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

      # Unset DJANGO_CACHE_URL means the database cache, shared across workers.
      # Throttle history lives in the cache, and a per-process cache would make
      # the real limit on login and password reset the rate times the worker
      # count. Needs `createcachetable` once -- see the runbook.
      - key: WEB_CONCURRENCY
        value: "2"

      # Mail over HTTPS rather than SMTP: outbound SMTP ports are commonly
      # blocked on free hosting, and a blocked port means registration
      # verification silently never arrives.
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: PRIVACY_CONTACT_EMAIL
        sync: false

# ---------------------------------------------------------------------------
# Deferred: the monthly market refresh
# ---------------------------------------------------------------------------
#
# Not a Render Cron, for two independent reasons.
#
# The browser does not fit. Headless Chromium needs 400-500MB on top of Django,
# past a free instance, and the image would carry it year-round for a job that
# runs monthly. The refresh runs on a GitHub Actions runner instead, against
# this same database -- see .github/workflows/refresh-market-data.yml -- with a
# developer workstation as the fallback.
#
# And the schedule itself waits on trust. `manage.py scrape_jobs` exits 0
# whether it worked or not; a validation run recorded
#
#     Status  : FAILED
#     Error   : Could not reach host. Are you offline?
#
# and still exited 0. Unattended, that is a monthly job reporting success while
# market data silently goes stale, and stale market data is not a visible
# outage -- it is a skill gap quietly computed against last year's adverts.
# `manage.py refresh_market_data` exists to fix precisely that: it takes a lock,
# reads the persisted ScrapeLog rather than the inner command's exit status, and
# exits non-zero when the acquisition failed. The workflow is manual
# (workflow_dispatch) until it has been proven from a hosted runner, because
# whether JobStreet serves a cloud IP at all is unestablished.
